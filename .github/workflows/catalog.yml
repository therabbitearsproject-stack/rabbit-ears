# Builds and publishes the site.
# - catalog.json (every channel's videos, pre-looked-up, so the TV guide loads instantly) is rebuilt
#   daily, on demand, and whenever index.html or the scripts change; it's committed to the repo.
# - Archive subtitle files are cached in subs/; reviewed embedded tracks are copied from captions/.
#   because archive.org doesn't let other sites read them directly.
# - games.json (the Games tab's shelves of Flash games) is rebuilt at the same times and committed too.
# - The site (the repo's files plus subs/) is then published to GitHub Pages.
name: Build and publish

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:         # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, so a queued run reuses the catalog an earlier run just saved
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide whether to rebuild the catalog
        id: need
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "catalog=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE '^(scripts/|captions/|assets/scifi-breaks/|assets/porchlight-breaks/|assets/trek-bumpers/facts\.json|\.github/workflows/)'; then
            echo "catalog=yes" >> "$GITHUB_OUTPUT"
          # A channel's search is its catalog key, so a changed search (or SAFE) needs a fresh pool.
          elif git diff "${{ github.event.before }}" "${{ github.sha }}" -- index.html 2>/dev/null | grep -qE '^[-+].*(const SAFE = |q: )'; then
            echo "catalog=yes" >> "$GITHUB_OUTPUT"
          else
            echo "catalog=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Test catalog builder
        run: node --test scripts/*.test.mjs
      - name: Build catalog.json
        if: steps.need.outputs.catalog == 'yes'
        run: node scripts/build-catalog.mjs
      - name: Build games.json
        if: steps.need.outputs.catalog == 'yes'
        run: node scripts/build-games.mjs
      - name: Add IMDb matches
        if: steps.need.outputs.catalog == 'yes'
        env:
          IMDB_LIMIT: "0"   # the lookups happen in imdb.yml; this only applies the saved matches
        run: node scripts/build-imdb.mjs || echo "::warning::Adding IMDb matches failed; the site keeps working without new links"
      - name: Restore subtitles
        uses: actions/cache/restore@v4
        with:
          path: subs
          key: subs-${{ github.run_id }}
          restore-keys: subs-
      - name: Fetch subtitles
        run: node scripts/fetch-subs.mjs
      - name: Save subtitles
        uses: actions/cache/save@v4
        with:
          path: subs
          key: subs-${{ github.run_id }}

      - name: Preserve the published next two hours
        run: node scripts/stage-programming.mjs
      - name: Commit catalog if changed
        run: |
          git config user.name "Rabbit Ears"
          git config user.email "353049428+therabbitearsproject-stack@users.noreply.github.com"
          git add catalog.json games.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update catalog"
          git pull --rebase -q
          git push

      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html catalog.json og.jpg share-card.html commercial-timing.js media-compatibility.js robots.txt sitemap.xml _site/
          cp -r assets _site/assets
          cp -r design-history _site/design-history
          cp -r problems _site/problems   # unlisted Problems dashboard
          cp -r privacy _site/privacy     # privacy policy (linked from the footer and the app stores)
          cp -r music-credits _site/music-credits # attribution for licensed bumper recordings
          cp -r app _site/app             # Android TV / Fire TV install file (unlinked; for sideloading)
          cp manifest.webmanifest _site/
          if [ -f games.json ]; then cp games.json _site/; fi
          cp -r subs _site/subs
          node scripts/build-pages.mjs _site   # channel and game pages plus sitemap.xml
          node scripts/build-tv-feed.mjs _site # schedule files for the Roku and other TV apps
          du -sh _site _site/subs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
