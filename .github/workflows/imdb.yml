# Matches the channels' shows and films to IMDb (through Wikidata) and saves the results in
# scripts/imdb-cache.json. It runs on its own so that new pushes, which restart the site's publish,
# can't cancel the slow lookups. The publish (catalog.yml) then reads the saved matches into
# catalog.json without looking anything up, and this starts one when it finds new matches.
name: Match IMDb

on:
  schedule:
    - cron: "41 7 * * *"   # daily, before the 09:17 catalog rebuild
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: imdb
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look up titles
        run: node scripts/build-imdb.mjs
      - name: Save matches and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -- catalog.json   # the publish rebuilds it; only the matches are kept here
          git config user.name "Rabbit Ears"
          git config user.email "353049428+therabbitearsproject-stack@users.noreply.github.com"
          git add scripts/imdb-cache.json
          if git diff --cached --quiet; then echo "No new matches"; exit 0; fi
          git commit -m "Update IMDb matches"
          git pull --rebase -q
          git push
          gh workflow run catalog.yml --ref main
