# Matches the channels' shows and films to IMDb (through Wikidata) and saves the results in
# scripts/imdb-cache.json. It runs on its own so that new pushes, which restart the site's publish,
# can't cancel the slow lookups. The publish (catalog.yml) then reads the saved matches into
# catalog.json without looking anything up, and this starts one when it finds new matches.
name: Match IMDb

on:
  schedule:
    - cron: "41 7 * * *"   # daily, before the 09:17 catalog rebuild
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: imdb
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Look up titles
        run: node scripts/build-imdb.mjs
      - name: Save matches and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the matches are kept; the publish rebuilds catalog.json. Others push to main while the
          # lookups run, so the new matches are merged into the latest file (retrying if main moves).
          cp scripts/imdb-cache.json "$RUNNER_TEMP/new.json"
          git config user.name "Rabbit Ears"
          git config user.email "353049428+therabbitearsproject-stack@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            node -e '
              const fs = require("fs"), f = "scripts/imdb-cache.json";
              let old = {}; try { old = JSON.parse(fs.readFileSync(f, "utf8")); } catch {}
              const all = { ...old, ...JSON.parse(fs.readFileSync(process.argv[1], "utf8")) };
              fs.writeFileSync(f, JSON.stringify(all, Object.keys(all).sort(), 0).replace(/\],"/g, "],\n\""));
            ' "$RUNNER_TEMP/new.json"
            git add scripts/imdb-cache.json
            if git diff --cached --quiet; then echo "No new matches"; exit 0; fi
            git commit -q -m "Update IMDb matches"
            if git push -q; then gh workflow run catalog.yml --ref main; exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
