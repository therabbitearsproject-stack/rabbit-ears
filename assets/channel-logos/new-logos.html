<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Channel logos, November 2026 batch</title>
<!-- Source for the ten channel logos added in November 2026 (12, 16, 27, 28, 41, 66, 67, 72, 73, 74).
     Open with ?logo=<file stem>, e.g. ?logo=72-headbangers, and render at 480×320 with a transparent
     background in headless Edge (see DEVLOG). Drawn as vector art to sit with the illustrated logos. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Shrikhand&family=Luckiest+Guy&family=Bangers&family=Limelight&family=Alfa+Slab+One&family=Metal+Mania&family=Monoton&family=Yellowtail&display=swap">
<style>
  html, body { margin: 0; width: 480px; height: 320px; overflow: hidden; background: transparent; }
  svg { display: block; width: 480px; height: 320px; }
  .o { stroke: #1a1210; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
  .t { paint-order: stroke; stroke: #1a1210; stroke-linejoin: round; text-anchor: middle; }
  .shadow { filter: drop-shadow(5px 7px 0 rgba(26,18,16,.45)); }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const burst = (cx, cy, r1, r2, n, fill, rot = 0) => {
  const p = [];
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n; p.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1)); }
  return `<polygon class="o" points="${p.join(" ")}" fill="${fill}"/>`;
};
const rays = (cx, cy, r, n, a, b) => Array.from({ length: n }, (_, i) => {
  const a0 = i * 2 * Math.PI / n, a1 = a0 + Math.PI / n;
  return `<path d="M${cx},${cy} L${cx + r * Math.cos(a0)},${cy + r * Math.sin(a0)} A${r},${r} 0 0 1 ${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)} Z" fill="${i % 2 ? a : b}"/>`;
}).join("");
const text = (x, y, s, font, size, fill, sw = 12, extra = "") =>
  `<text class="t" x="${x}" y="${y}" font-family="${font}" font-size="${size}" fill="${fill}" stroke-width="${sw}" ${extra}>${s}</text>`;
// A ribbon banner across the lower third, with folded tails.
const ribbon = (y, h, fill, tail) => `
  <path class="o" d="M40,${y + 18} L80,${y + 10} L80,${y + h + 10} L40,${y + h + 18} L58,${y + h / 2 + 14} Z" fill="${tail}"/>
  <path class="o" d="M440,${y + 18} L400,${y + 10} L400,${y + h + 10} L440,${y + h + 18} L422,${y + h / 2 + 14} Z" fill="${tail}"/>
  <path class="o" d="M66,${y} Q240,${y - 22} 414,${y} L414,${y + h} Q240,${y + h - 22} 66,${y + h} Z" fill="${fill}"/>`;
